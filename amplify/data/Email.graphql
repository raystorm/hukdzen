extend type Query {
   getPublicUserEmailPreferences(email: AWSEmail!): EmailPreferences @aws_iam
}

extend type Mutation {
   sendTemplatedEmail(
      to:           [String!]!
      cc:           [String]
      templateName: String!
      templateArgs: AWSJSON!
      globalParams: AWSJSON
   ): AWSJSON
      @aws_cognito_user_pools

   updateUserEmailPreferences(
      email:       AWSEmail!
      token:       String!
      preferences: AWSJSON!
   ): EmailPreferences
      @aws_iam
}
