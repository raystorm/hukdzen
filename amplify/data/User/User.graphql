enum OptOutReason {
   BOUNCE_HARD
   BOUNCE_SOFT
   COMPLAINT
   USER_CHOICE
}

type EmailPreferences {
   allOptOut:          Boolean
   boxRequestOptOut:   Boolean
   collaboratorOptOut: Boolean
   systemOptOut:       Boolean
   optOutReason:       OptOutReason
   optOutAt:           AWSDateTime
   softBounceCount:    Int
}

input EmailPreferencesFilterInput
{
   allOptOut:          BooleanFilter
   boxRequestOptOut:   BooleanFilter
   collaboratorOptOut: BooleanFilter
   systemOptOut:       BooleanFilter
   optOutReason:       ModelOptOutReasonInput
   optOutAt:           DateTimeFilter
   softBounceCount:    IntFilter
}

input ModelOptOutReasonInput
{
   eq: OptOutReason
   ne: OptOutReason
}

type User implements Gyet @model @auth(rules: [{ allow: private,
                                                 operations: [create, update, delete, read] }])
{
   id:               ID!
   name:             String!
   clan:             Clan
   waa:              String
   email:            AWSEmail!        @index(name: "byEmail", queryField: "getUserByEmail")
   isAdmin:          Boolean
   emailPreferences: EmailPreferences
}

type UserList @aws_iam @aws_cognito_user_pools
{
   items:     [User]
   nextToken: String
}

input UserFilterInput
{
   id:               IDFilter
   name:             StringFilter
   clan:             ModelClanInput
   waa:              StringFilter
   email:            StringFilter
   isAdmin:          BooleanFilter
   emailPreferences: EmailPreferencesFilterInput
   and:              [UserFilterInput]
   or:               [UserFilterInput]
   not:              UserFilterInput
}

input EmailPreferencesInput
{
   allOptOut:          Boolean
   boxRequestOptOut:   Boolean
   collaboratorOptOut: Boolean
   systemOptOut:       Boolean
   optOutReason:       OptOutReason
   optOutAt:           AWSDateTime
   softBounceCount:    Int
}

input UserInput
{
   id:               ID
   name:             String!
   clan:             Clan
   waa:              String
   email:            AWSEmail!
   isAdmin:          Boolean
   emailPreferences: EmailPreferencesInput
}

extend type Mutation {
   createUserGuarded(input: UserInput!): User
      @aws_cognito_user_pools

   updateUserGuarded(input: UserInput!): User
      @aws_cognito_user_pools
}
