type Summary {
   title:        String
   description:  String
   # future: history, lineage, notes, etc.
}

input SummaryInput {
   title:       String
   description: String
}

input SummaryFilterInput
{
   title:       StringFilter
   description: StringFilter
}

interface Content
{
    id:  ID!

    eng: Summary  # title required
    bc:  Summary
    ak:  Summary

    contentOwner: User    #@hasOne #required validated in resolver, for impl type

    created: AWSDateTime!
    updated: AWSDateTime

    box: Xbiis            #@hasOne #required validated in resolver, for impl type

    # consider adding index fields, and setting index in the impl types
    # boxXbiisId:     ID! #@index(name: "byBox",   queryField: "documentDetailsByBox")
    # docOwnerUserId: ID! #@index(name: "byOwner", queryField: "documentDetailsByOwner")
}