type DocumentDetails @model @auth(rules: [{ allow: private,
                                            operations: [create, update, delete, read] }])
{
   id: ID!

   eng_title:       String!
   eng_description: String!

   author:      Author      @hasOne #required validated in resolver
   docOwner:    User        @hasOne #required validated in resolver

   # AWS Bucket File Key, like a file path
   fileKey:     String!
   # Sha256 FileHash, used for duplicate checking
   fileHash:    String

   created:     AWSDateTime!
   updated:     AWSDateTime

   type:        String              # stores MimeType values from files
   version:     Float!

   box:         Xbiis       @hasOne # Box the Document Item Belongs to, required

   bc_title:       String!
   bc_description: String!

   ak_title:       String!
   ak_description: String!

   # Search Keywords
   keywords:       [String]
   boxXbiisId:     ID       @index(name: "byBox",   queryField: "documentDetailsByBox")
   docOwnerUserId: ID       @index(name: "byOwner", queryField: "documentDetailsByOwner")
}

enum Clan {
   GANHADA     # RAVEN
   LAXSGIIK    # EAGLE
   GITSBUTWADA # KILLER WHALE (ORCA)
   LAXGIBU     # WOLF
}

interface Gyet
{
   id:       ID!
   name:     String!
   clan:     Clan
   waa:      String # smalgyax name
   email:    AWSEmail
}

type Author implements Gyet @model @auth(rules: [{ allow: private,
                                                   operations: [create, update, delete, read] }])
{
   id:       ID!
   name:     String!
   clan:     Clan
   waa:      String
   email:    AWSEmail
}

enum AccessLevel {
   NONE
   READ
   WRITE
}

enum BoxPurpose {
   USER    # Personal User box, created automatically
   GROUP   # Group / Shared / Requested boxes
   DEFAULT # Default Public box
}

type Xbiis @model @auth(rules: [{ allow: private,
                                  operations: [create, update, delete, read] }])
{
   id:          ID!
   name:        String!
   waa:         String
   owner:       User        @hasOne #required validated in resolver
   defaultRole: AccessLevel
   purpose:     BoxPurpose
   ownerUserId: ID          @index(name: "byOwner", queryField: "xbiisByOwner")
}

enum BoxRequestStatus {
   PENDING
   APPROVED
   DENIED
}

type BoxRequest @model @auth(rules: [{ allow: private,
                                       operations: [create, update, delete, read] }])
{
   id:            ID!
   requestedName: String!
   requestReason: String!
   status:        BoxRequestStatus!
   denialReason:  String                    #required if status = DENIED
   createdBy:     User              @hasOne #required validated in resolver
   approvedBy:    User              @hasOne #required if status = APPROVED
   createdBox:    Xbiis             @hasOne #required if status = APPROVED
}

enum OptOutReason {
   BOUNCE_HARD
   BOUNCE_SOFT
   COMPLAINT
   USER_CHOICE
}

type EmailPreferences {
   allOptOut:          Boolean
   boxRequestOptOut:   Boolean
   collaboratorOptOut: Boolean
   systemOptOut:       Boolean
   optOutReason:       OptOutReason
   optOutAt:           AWSDateTime
   softBounceCount:    Int
}

type User implements Gyet @model @auth(rules: [{ allow: private,
                                                 operations: [create, update, delete, read] }])
{
   id:               ID!
   name:             String!
   clan:             Clan
   waa:              String
   email:            AWSEmail!        @index(name: "byEmail", queryField: "getUserByEmail")
   isAdmin:          Boolean
   emailPreferences: EmailPreferences
}

type BoxUser @model @auth(rules: [{ allow: private,
                                    operations: [create, update, delete, read] }])
{
   id:         ID!
   user:       User         @hasOne #required validated in resolver
   box:        Xbiis        @hasOne #required validated in resolver
   role:       AccessLevel!
   userUserId: ID           @index(name: "byUser", queryField: "boxUsersByUser")
}

type Collection @model @auth(rules: [{ allow: private,
                                       operations: [create, update, delete, read] }])
{
   id: ID!

   eng_title:       String!
   eng_description: String!

   collectionOwner: User             @hasOne #required validated in resolver

   created:         AWSDateTime!
   updated:         AWSDateTime

   box:             Xbiis            @hasOne #required validated in resolver

   bc_title:        String!
   bc_description:  String!

   ak_title:        String!
   ak_description:  String!

   items:           [CollectionItem] @hasMany
}

type CollectionItem @model @auth(rules: [{ allow: private,
                                           operations: [create, update, delete, read] }])
{
   id: ID!

   collection:             Collection @belongsTo #required validated in resolver
   collectionCollectionId: ID         @index(name: "byCollection", queryField: "collectionItemsByCollection")

   # Exactly one must be set: document XOR childCollection (mutually exclusive, both required)
   document:        DocumentDetails   @hasOne
   childCollection: Collection        @hasOne
   
   order:           Int
   created:         AWSDateTime!
}

enum SearchResultType {
   DOCUMENT
   COLLECTION
}

enum SortDirection {
   ASC
   DESC
}

type SearchResultItem {
   type:       SearchResultType! @auth(rules: [{ allow: private }])
   document:   DocumentDetails   @auth(rules: [{ allow: private }])
   collection: Collection        @auth(rules: [{ allow: private }])
   score:      Float             @auth(rules: [{ allow: private }])
}

type SearchResults {
   items:     [SearchResultItem!]! @auth(rules: [{ allow: private }])
   total:     Int!                 @auth(rules: [{ allow: private }])
   from:      Int!                 @auth(rules: [{ allow: private }])
   limit:     Int!                 @auth(rules: [{ allow: private }])
   nextToken: String               @auth(rules: [{ allow: private }])
}

type Query {
   search(
      query:         String!
      boxIds:        [ID!]
      field:         String
      sortField:     String
      sortDirection: SortDirection
      limit:         Int
      from:          Int
   ): SearchResults
        # @function(name: "searchRunner")
        # @auth(rules: [{ allow: private }])
        @aws_cognito_user_pools

   #getPublicUserEmailPeferences(email: AWSEmail!): EmailPreferences
}

# Custom mutation will be added via Lambda function resource
type Mutation {
   sendTemplatedEmail(
      to:           [String!]!
      cc:           [String]
      templateName: String!
      templateArgs: AWSJSON!
      globalParams: AWSJSON
   ): AWSJSON

   updateUserEmailPreferences(
      email:       AWSEmail!
      token:       String!
      preferences: AWSJSON!
   ): EmailPreferences
}
