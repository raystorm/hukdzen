type Collection @model @auth(rules: [{ allow: private,
                                       operations: [create, update, delete, read] }])
{
   id: ID!

   eng_title:       String!
   eng_description: String!

   collectionOwner: User             @hasOne #required validated in resolver

   created: AWSDateTime!
   updated: AWSDateTime

   box: Xbiis @hasOne #required validated in resolver

   bc_title:        String!
   bc_description:  String!

   ak_title:        String!
   ak_description:  String!

   items: [CollectionItem] @hasMany
}

type CollectionItem @model @auth(rules: [{ allow: private,
                                           operations: [create, update, delete, read] }])
{
   id: ID!

   collection:             Collection @belongsTo #required validated in resolver
   collectionCollectionId: ID         @index(name: "byCollection", queryField: "collectionItemsByCollection")

   # Exactly one must be set: document XOR childCollection (mutually exclusive, both required)
   document:        DocumentDetails @hasOne
   childCollection: Collection      @hasOne
   
   order:   Int
   created: AWSDateTime!
}

type CollectionList @aws_iam @aws_cognito_user_pools
{
   items:     [Collection]
   nextToken: String
}

type CollectionItemList @aws_iam @aws_cognito_user_pools
{
   items:     [CollectionItem]
   nextToken: String
}

extend type Query {
   getCollectionDetailed(id: ID!): Collection
      @aws_cognito_user_pools

   getCollectionItemDetailed(id: ID!): CollectionItem
      @aws_cognito_user_pools

   listCollectionDetailed(
      filter: CollectionFilterInput
      limit: Int
      nextToken: String
   ): CollectionList
      @aws_cognito_user_pools

   listCollectionItemDetailed(
      filter: CollectionItemFilterInput
      limit: Int
      nextToken: String
   ): CollectionItemList
      @aws_cognito_user_pools

}

extend type Mutation {
   createCollectionGuarded(input: CollectionInput!): Collection
      @aws_cognito_user_pools

   updateCollectionGuarded(input: CollectionInput!): Collection
      @aws_cognito_user_pools

   createCollectionItemGuarded(input: CollectionItemInput!): CollectionItem
      @aws_cognito_user_pools

   updateCollectionItemGuarded(input: CollectionItemInput!): CollectionItem
      @aws_cognito_user_pools
}
